## 投稿後2時間の初動。**再生数だけ記録しても意味がない。**
## 見るべきは視聴完了率と離脱点。
##
## 離脱が集中する位置の読み方:
##   0〜3秒        フックが機能していない  → hook / hookStyle
##   セクション境界  つなぎで切られている    → テンプレの境界処理（重ねる）
##   中盤で一様に減る 尺が長い / 密度が低い  → totalDurationSec を下げる
##
## plan.md の運用ルール（頻度・尺・アルゴリズム挙動）は二次情報で出典が弱い。
## ここが溜まったら、こちらを正にして plan.md を書き換える。
metrics: []
## 記入例:
# metrics:
#   - id: 2026-09-18-remotion-shorts-pipeline
#     postedAt: 2026-09-18T19:00+09:00
#     tiktok:
#       views2h: 0
#       completionRate: 0.0     # 視聴完了率
#       dropOffSec: 0.0         # 離脱が集中した秒数
